<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heineken — Historique de retrait</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 10%,#14934a 0%,transparent 45%),radial-gradient(circle at 85% 90%,#0a4f20 0%,transparent 50%),linear-gradient(170deg,#00782a 0%,#00602a 60%,#004a20 100%);background-attachment:fixed;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:420px;min-height:100vh;padding:0 16px 110px;position:relative}
.top{display:none;text-align:center;position:sticky;top:0;z-index:16;background:#00602a;margin:-16px -16px 0;padding:14px 16px 10px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.top .brand{font-size:24px;font-weight:800;letter-spacing:4px}
.top .brand span{color:#ff3b3b}
.top .sub{font-size:10px;letter-spacing:3px;opacity:.75;margin-top:4px}
.page{display:none}
.page.on{display:block}
h2{font-size:20px;margin:6px 2px 14px}
h3{font-size:16px;margin-bottom:6px}
p{font-size:13px;line-height:1.55;opacity:.9}
.card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:18px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08))}
.lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.big{font-size:34px;font-weight:800;margin-top:6px}
.code{font-size:26px;font-weight:800;letter-spacing:4px;margin:8px 0 12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:14px}
.row:last-child{border-bottom:0}
.row span:first-child{opacity:.75}
.row span:last-child{font-weight:700;text-align:right;word-break:break-all}
.product{display:flex;align-items:center;gap:14px}
.product .thumb{width:56px;height:70px;flex:0 0 56px;background:rgba(255,255,255,.12);border-radius:14px;display:flex;align-items:center;justify-content:center}
.product .thumb svg{height:56px}
.product .name{font-weight:800;font-size:16px}
.product .desc{font-size:12px;opacity:.8;margin-top:3px;line-height:1.4}
.btn{display:block;width:100%;padding:12px;background:#ff3b3b;color:#fff;border:0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;transition:background .2s,transform .15s}
.btn:hover{background:#e02a2a}

.btn.sec{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4)}
.btn.sec:hover{background:rgba(255,255,255,.25)}
.btn.wa{background:#25d366}
.btn.wa:hover{background:#1ebe5a}
.toast{position:fixed;z-index:80;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#00602a;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}
nav.bottom{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:420px;background:rgba(0,50,22,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.15);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.bottom a{text-decoration:none;background:none;border:0;color:#fff;opacity:.6;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;cursor:pointer;padding:6px 0;border-radius:12px;transition:opacity .2s,background .2s}
nav.bottom a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom a.on{opacity:1;background:rgba(255,255,255,.12)}
nav.bottom a.on svg{stroke:#ff3b3b}

.empty{min-height:40vh}
.video{margin:0 -16px 8px;position:sticky;top:0;z-index:15;background:#00602a;padding-top:0;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.vhead{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:0 16px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#ff3b3b;color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:5px 10px;border-radius:999px;box-shadow:0 4px 12px rgba(255,59,59,.45)}
.pill i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.vtitle{font-size:14px;font-weight:700;opacity:.92}
.frame{padding:0;background:#000;box-shadow:0 18px 36px rgba(0,0,0,.4)}
.ratio{position:relative;width:100%;padding-top:56.25%;overflow:hidden;background:#000}
.ratio iframe,.ratio #ytplayer{position:absolute;inset:0;width:100%;height:100%;border:0}
.fixbar{position:sticky;top:var(--hh,60px);z-index:15;background:#00602a}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin:0;padding:0 16px 0}
.action{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;background:linear-gradient(180deg,#00923a,#00782a);border:1px solid rgba(255,255,255,.2);border-radius:16px;color:#fff;font-size:12px;font-weight:800;text-align:center;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25);transition:transform .15s,filter .2s}
.action:hover{filter:brightness(1.08)}
.action:active{transform:scale(.97)}
.ico{width:38px;height:38px;border-radius:50%;background:#d71920;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(215,25,32,.45)}
.action svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ptitle{font-size:16px;margin:4px 2px 12px}
.palette{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;margin-bottom:10px;box-shadow:0 6px 14px rgba(0,0,0,.2);position:relative}
.pico{width:44px;height:52px;flex:0 0 44px;background:rgba(255,255,255,.12);border-radius:12px;display:flex;align-items:center;justify-content:center}
.pico svg{height:44px}
.pinfo{flex:1;min-width:0}
.pname{font-size:14px;font-weight:800;margin-bottom:4px}
.prow{display:flex;justify-content:space-between;font-size:12px;opacity:.9;padding:2px 0}
.prow b{font-weight:800}
.pstatus{position:absolute;top:10px;right:10px;background:#d71920;color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.5px;text-transform:uppercase}
.palette{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:12px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.06) 60%,rgba(215,25,32,.22));border:1px solid rgba(255,255,255,.25);box-shadow:0 10px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25);flex-wrap:wrap}
.palette::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 1px,transparent 1.6px),radial-gradient(circle,#ffe9a8 1px,transparent 1.6px),radial-gradient(circle,#fff 0.8px,transparent 1.4px);background-size:38px 42px,54px 60px,26px 30px;background-position:0 0,17px 23px,9px 11px;opacity:.35;animation:sparkle 3.6s ease-in-out infinite}
@keyframes sparkle{0%,100%{opacity:.25}50%{opacity:.6}}
.palette>*{position:relative;z-index:1}
.pico{width:52px;height:62px;flex:0 0 52px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.08));border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.pico svg{height:50px}
.pname{font-size:15px;font-weight:800;letter-spacing:.3px;margin-bottom:6px;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.prow{font-size:12px;padding:3px 0;opacity:.95}
.prow span{opacity:.75}
.pstatus{top:12px;right:12px;background:linear-gradient(135deg,#ff4d55,#d71920);box-shadow:0 4px 10px rgba(215,25,32,.5);font-size:10px;padding:4px 10px}
.pbtn{flex:1 1 100%;margin-top:4px;padding:11px;border:0;border-radius:12px;background:linear-gradient(180deg,#ffffff,#eaf5ee);color:#00782a;font-size:14px;font-weight:800;letter-spacing:.4px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25);transition:transform .15s,filter .2s}
.pbtn:hover{filter:brightness(1.04)}
.pbtn:active{transform:scale(.97)}
.overlay{position:fixed;inset:0;background:rgba(0,30,12,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.show{display:flex}
.rmodal{background:linear-gradient(160deg,#00923a,#00602a);border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:22px 20px;width:100%;max-width:340px;box-shadow:0 24px 50px rgba(0,0,0,.45);color:#fff}
.rhead{margin-bottom:10px}
.rmodal h3{font-size:19px;font-weight:800;margin-bottom:12px}
.rrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:14px}
.rrow:last-of-type{border-bottom:0}
.rrow span{opacity:.8}
.rrow b{font-weight:800}
.rclose{width:100%;margin-top:16px;padding:12px;border:0;border-radius:12px;background:#fff;color:#00782a;font-size:15px;font-weight:800;cursor:pointer}
.rclose:active{transform:scale(.98)}
.palette{cursor:pointer}
.ptotal{margin-top:8px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;background:linear-gradient(135deg,#ffd76a,#f5b82e);color:#4a2f00;box-shadow:0 4px 12px rgba(245,184,46,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.ptotal span{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.ptotal b{font-size:15px;font-weight:900}
.rtot{margin-top:6px;border-top:1px solid rgba(255,255,255,.3);border-bottom:0;padding-top:14px}
.rtot b{color:#ffd76a;font-size:16px}
.rentpage{position:fixed;inset:0;z-index:60;display:none;overflow-y:auto;background:radial-gradient(circle at 20% 0%,#1fa452 0%,transparent 50%),radial-gradient(circle at 90% 100%,#0a4f20 0%,transparent 55%),linear-gradient(170deg,#00782a 0%,#00602a 60%,#004a20 100%)}
.rentpage.show{display:block}
.rwrap{max-width:420px;margin:0 auto;padding:22px 20px 40px}
.rback{background:none;border:0;color:#fff;font-size:14px;font-weight:700;cursor:pointer;opacity:.85;padding:6px 0}
.rbig{width:120px;height:140px;margin:14px auto 16px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.05));display:flex;align-items:center;justify-content:center;box-shadow:0 0 44px rgba(255,215,106,.35),inset 0 0 0 1px rgba(255,255,255,.3)}
.rbig svg{height:118px}
.rkicker{text-align:center;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#ffd76a}
.rtitle{text-align:center;font-size:26px;font-weight:900;margin:6px 0 4px;letter-spacing:.5px}
.rsub{text-align:center;font-size:13px;opacity:.85;margin-bottom:18px}
.rcard{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:6px 18px;box-shadow:0 14px 30px rgba(0,0,0,.3)}
.rentpage .rrow{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:15px}
.rentpage .rrow:last-child{border-bottom:0}
.rentpage .rrow span{opacity:.8}
.rentpage .rrow b{font-weight:800}
.rentpage .rtot{margin-top:4px;border-top:1px solid rgba(255,255,255,.3);padding-top:16px}
.rentpage .rtot b{color:#ffd76a;font-size:18px}
.rconfirm{width:100%;margin-top:22px;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,#ffd76a,#f5b82e);color:#4a2f00;font-size:16px;font-weight:900;letter-spacing:.3px;cursor:pointer;box-shadow:0 10px 22px rgba(245,184,46,.45)}
.rconfirm:active{transform:scale(.98)}
.sbtn{margin-left:auto;background:#fff;color:#00782a;border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.sbtn:active{transform:scale(.96)}
.balance{margin-top:4px;margin-bottom:16px}
.bigbal{font-size:34px;font-weight:800;margin-top:6px}
/* ---------- Section investissements : mise en valeur ---------- */
.invest-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 14px}
.invest-head h2{font-size:22px;font-weight:900;letter-spacing:.3px;margin:0;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.invest-head span{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:#fff;color:#00782a;padding:5px 10px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.palette{padding:16px;gap:16px;margin-bottom:16px;border-radius:24px;border:1px solid rgba(255,255,255,.35);background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 55%,rgba(215,25,32,.25));box-shadow:0 14px 30px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.palette .pico{width:76px;height:88px;flex:0 0 76px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.1));box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 8px 18px rgba(0,0,0,.25)}
.palette .pico svg{height:76px;width:auto}
.palette .pname{font-size:18px;font-weight:900;margin-bottom:8px;letter-spacing:.4px}
.palette .prow{font-size:13px;padding:4px 0;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.12)}
.palette .prow:last-of-type{border-bottom:0}
.palette .prow span{opacity:.85}
.palette .prow b{font-weight:800;color:#fff}
.palette .ptotal{margin-top:10px;padding:10px 12px;border-radius:14px}
.palette .ptotal b{font-size:17px}
.palette .pstatus{top:14px;right:14px;font-size:11px;padding:5px 12px}
.palette .pbtn{margin-top:12px;padding:13px;font-size:15px;border-radius:14px;letter-spacing:.6px;text-transform:uppercase}
/* ---------- Carte solde : mise en valeur ---------- */
.card.balance{position:relative;overflow:hidden;margin:6px 0 18px;padding:20px 20px 18px;border-radius:24px;background:linear-gradient(135deg,#ffe9a0 0%,#ffd76a 40%,#f5b82e 100%);color:#4a2f00;border:1px solid rgba(255,255,255,.5);box-shadow:0 14px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.6)}
.card.balance::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%);pointer-events:none}
.card.balance .lbl{font-size:12px;font-weight:900;letter-spacing:1.4px;color:#7a4a00;opacity:1;display:flex;align-items:center;gap:8px}
.card.balance .lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:#00782a;box-shadow:0 0 0 4px rgba(0,120,42,.2)}
.card.balance .bigbal{font-size:40px;font-weight:900;letter-spacing:.5px;margin-top:8px;display:flex;align-items:baseline;gap:6px;color:#3d2500;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.card.balance .bigbal span{font-variant-numeric:tabular-nums}
.card.balance .bigbal{font-size:40px}
.lbl-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eye{display:inline-flex;align-items:center;gap:6px;background:rgba(61,37,0,.1);border:1px solid rgba(61,37,0,.25);color:#3d2500;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;cursor:pointer;transition:transform .15s,background .2s}
.eye svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye:active{transform:scale(.95)}
.eye:hover{background:rgba(61,37,0,.18)}
.card.balance.hidden #main-balance{filter:blur(9px);user-select:none}
.palette .prow b,.palette .ptotal b,.palette .prow span{white-space:nowrap}
/* ---------- Ligne Bénéfices mise en valeur ---------- */
.palette .prow:nth-of-type(3){margin:6px 0;padding:7px 10px;border-radius:12px;background:linear-gradient(90deg,rgba(74,222,128,.28),rgba(74,222,128,.08));border:1px solid rgba(134,239,172,.45);border-bottom:1px solid rgba(134,239,172,.45)}
.palette .prow:nth-of-type(3) span{opacity:1;font-weight:800;color:#d9ffe5;letter-spacing:.3px}
.palette .prow:nth-of-type(3) b{color:#bbf7d0;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.25)}
.palette .ptotal{background:linear-gradient(135deg,#ffe9a0,#ffd76a 45%,#f5b82e);box-shadow:0 6px 14px rgba(245,184,46,.45),inset 0 1px 0 rgba(255,255,255,.7)}
/* ---------- Total des bénéfices : bloc jaune bien arrangé ---------- */
.palette .ptotal{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:12px 10px}
.palette .ptotal span{font-size:11px;font-weight:900;letter-spacing:1.2px;opacity:.85}
.palette .ptotal b{font-size:22px;font-weight:900;letter-spacing:.3px;color:#3d2500}
.ratio .shield{position:absolute;inset:0;z-index:2;background:transparent;cursor:default}
/* ---------- Carte solde pailletée ---------- */
.card.balance{background:linear-gradient(135deg,#1b1404 0%,#4a3300 40%,#c98a12 75%,#ffd76a 100%)!important;color:#fff7de!important;border:1px solid rgba(255,235,170,.7)!important;box-shadow:0 18px 36px rgba(0,0,0,.35),0 0 30px rgba(255,215,106,.25)!important;position:relative;overflow:hidden}
.card.balance .lbl{color:#ffe9a0!important;opacity:1!important}
.card.balance .lbl::before{background:#7CFFB2!important;box-shadow:0 0 0 4px rgba(124,255,178,.25)!important}
.card.balance .bigbal{color:#fff7de!important;text-shadow:0 0 18px rgba(255,215,106,.7),0 2px 6px rgba(0,0,0,.4)!important;font-size:42px!important}
.card.balance .eye{background:rgba(255,255,255,.14)!important;border-color:rgba(255,235,170,.6)!important;color:#fff7de!important}
.card.balance .spark{position:absolute;width:10px;height:10px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:.2;animation:twinkle 2.4s ease-in-out infinite;pointer-events:none;z-index:0}
.card.balance .spark.s1{top:14px;right:70px}
.card.balance .spark.s2{top:58px;right:22px;width:7px;height:7px;animation-delay:.6s}
.card.balance .spark.s3{bottom:60px;right:44px;width:12px;height:12px;animation-delay:1.2s}
.card.balance .spark.s4{bottom:20px;left:40%;width:8px;height:8px;animation-delay:1.8s}
.card.balance>*:not(.spark){position:relative;z-index:1}
.card.balance.hidden #main-balance{filter:blur(9px);user-select:none}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.tot{padding:10px 8px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,235,170,.35);text-align:center}
.tot .tk{font-size:10px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#ffe9a0}
.tot .tv{font-size:14px;font-weight:900;margin-top:4px;color:#fff;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.card.balance .spark{animation:none}}
/* ---------- Bloc profil en haut de la page Compte ---------- */
.profile{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:16px;margin:6px 0 16px;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 60%,rgba(215,25,32,.25));border:1px solid rgba(255,255,255,.3);box-shadow:0 14px 30px rgba(0,0,0,.25)}
.avatar{flex:0 0 58px;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#3d2500;background:linear-gradient(135deg,#ffe9a0,#ffd76a 45%,#f5b82e);box-shadow:0 8px 18px rgba(245,184,46,.45),inset 0 0 0 3px rgba(255,255,255,.35)}
.pinfo2{min-width:0;flex:1}
.hello{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:#ffe9a0}
.pname2{font-size:20px;font-weight:900;margin-top:3px;letter-spacing:.3px;text-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pacc{margin-top:8px;display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.2);font-size:12px}
.pacc span{opacity:.8}

/* ---------- Historique compact et soigné ---------- */

/* ---------- Palette de retrait : bien visible ---------- */

.wcard{margin:0 0 10px!important;padding:16px 16px 14px!important;border-radius:0!important;border-left:0!important;border-right:0!important;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 60%,rgba(215,25,32,.2))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}

.wlabel{font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#ffe9a0;opacity:.9}
.wamt{font-size:26px!important;font-weight:900!important;color:#ffd76a;margin-top:2px;text-shadow:0 0 14px rgba(255,215,106,.4)}
.wbadge{margin-top:4px}

.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px}

/* ---------- Cartes de retrait : design avancé ---------- */
.wcard{position:relative;overflow:hidden;isolation:isolate;transition:transform .2s ease}
.wcard:active{transform:scale(.99)}
.wcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#ffb84d,#f59e0b);box-shadow:0 0 14px rgba(245,158,11,.6)}
.wcard.is-paid::before{background:linear-gradient(180deg,#7cffb2,#1ebe5a);box-shadow:0 0 14px rgba(30,190,90,.6)}
.wcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite;pointer-events:none;z-index:0}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.wcard>*{position:relative;z-index:1}
.wright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.wop{font-size:10px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.wop.op-moov{background:linear-gradient(135deg,#2563eb,#1e40af);border-color:transparent}

.wop.op-mtn{background:linear-gradient(135deg,#ffcc00,#e0b000);color:#3d2500;border-color:transparent}
.wop.op-wave{background:linear-gradient(135deg,#1dc8e8,#0aa6c8);border-color:transparent}
.wbadge{margin-top:0!important;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.wbadge:not(.ok){background:linear-gradient(135deg,#ffb84d,#f59e0b);color:#3d2500}
.wcell{transition:background .2s}
.wcard:hover .wcell{background:rgba(255,255,255,.12)}
.wcell.hi{box-shadow:inset 0 0 0 1px rgba(255,215,106,.35),0 6px 16px rgba(245,184,46,.15)}
@media (prefers-reduced-motion: reduce){.wcard::after{animation:none}}

/* ---------- Cartes de retrait plus compactes ---------- */
.wcard{padding:11px 12px 10px!important;margin-bottom:8px!important}
.wtop{margin-bottom:8px!important}
.wlabel{font-size:9px!important}
.wamt{font-size:19px!important}
.wright{gap:4px}

.wcell.hi b{font-size:13px!important}
.wcard::before{width:3px!important}

/* ---------- Trois cartes visibles à la fois, le reste défile ---------- */
#hList{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 0 6px;margin:0 -14px;scrollbar-width:thin;scrollbar-color:rgba(255,215,106,.6) transparent}
#hList::-webkit-scrollbar{width:4px}
#hList::-webkit-scrollbar-thumb{background:rgba(255,215,106,.6);border-radius:4px}

/* ---------- Défilement : chaque carte s'arrête bien en entier ---------- */
#hList{scroll-snap-type:y mandatory;scroll-padding-top:0}
#hList .wcard{scroll-snap-align:start;scroll-snap-stop:always}
.htitle{font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:#ffe9a0;opacity:.85;margin:0 2px 8px}

/* ---------- Titre de la page : design soigné ---------- */
.htitle{display:flex;align-items:center;gap:10px;margin:2px 0 12px;font-size:10px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;color:#ffe9a0}
.htitle::before{content:"";width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:#ffd76a;box-shadow:0 0 0 3px rgba(255,215,106,.22),0 0 12px rgba(255,215,106,.6)}
.htitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,215,106,.7),rgba(255,215,106,0))}

.htitle span{white-space:nowrap}
.htitle::after{order:2}
.hcount{order:3;font-style:normal;min-width:24px;padding:3px 9px;border-radius:999px;text-align:center;font-size:11px;font-weight:900;color:#3d2500;background:linear-gradient(135deg,#ffe9a0,#ffd76a 45%,#f5b82e);box-shadow:0 4px 10px rgba(245,184,46,.35)}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand">HEINEKEN<span>★</span></div>
    <div class="sub">LÀ BOISSONS · PURE MALT LAGER</div>
  </header>

  <section class="page on">

    <div class="htitle"><span>Historique retrait Heineken</span><em class="hcount" id="hCount">0</em></div>
    <div id="hList"><div class="empty-msg">Chargement de vos retraits…</div></div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVNLSc3JXWvTxiKk2n-mjmVUv39a_yuVM",
  authDomain: "heineken-c174e.firebaseapp.com",
  databaseURL: "https://heineken-c174e-default-rtdb.firebaseio.com",
  projectId: "heineken-c174e",
  storageBucket: "heineken-c174e.firebasestorage.app",
  messagingSenderId: "756445276249",
  appId: "1:756445276249:web:0989f661c0b97ef34be948"
};
const LOGIN_PAGE = "heineken-pro-v9.html";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const $ = id => document.getElementById(id);
const fmt = n => Math.round(Number(n) || 0).toLocaleString("fr-FR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = t => t ? new Date(t).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
let items = [];
let payout = {};

// Hauteur de la liste = exactement 3 cartes entières (aucune carte coupée)
function fitThree() {
  const list = $("hList");
  const cards = list.querySelectorAll(".wcard");
  if (cards.length < 2) { list.style.maxHeight = "none"; return; }
  const n = Math.min(3, cards.length);
  const style = getComputedStyle(cards[0]);
  const gap = parseFloat(style.marginBottom) || 0;
  let h = 0;
  for (let i = 0; i < n; i++) h += cards[i].offsetHeight + (i < n - 1 ? gap : 0);
  list.style.maxHeight = (h + 6) + "px";
}
window.addEventListener("resize", fitThree);

function render() {
  const hc = $("hCount"); if (hc) hc.textContent = items.length;
  const list = $("hList");
  const shown = items;
  if (!shown.length) {
    list.innerHTML = '<div class="empty-msg">Aucun retrait pour le moment.</div>';
    return;
  }
  list.innerHTML = shown.map(w => {
    const paid = w.status === "Payé";
    const fee = w.fee ?? Math.round((Number(w.amount) || 0) * 0.05);
    const net = w.net ?? ((Number(w.amount) || 0) - fee);
    const name = w.name || payout.name || "";
    const operator = w.operator || payout.operator || "";
    const phone = w.phone || payout.phone || "";
    return `
    <div class="wcard ${paid ? "is-paid" : "is-wait"}">
      <div class="wtop">
        <div>
          <div class="wlabel">Montant demandé</div>
          <div class="wamt">${fmt(w.amount)} F</div>
        </div>
        <div class="wright">
          <span class="wop op-${(operator || "").toLowerCase()}">${esc(operator) || "—"}</span>
          <span class="wbadge ${paid ? "ok" : ""}">${esc(w.status)}</span>
        </div>
      </div>
      <div class="wgrid">
        <div class="wcell"><span>Frais (5 %)</span><b>${fmt(fee)} F</b></div>
        <div class="wcell hi"><span>Montant reçu</span><b>${fmt(net)} F</b></div>
        <div class="wcell wide"><span>Date de demande</span><b>${fmtDate(w.createdAt)}</b></div>
        <div class="wcell"><span>Bénéficiaire</span><b>${esc(name) || "—"}</b></div>
        <div class="wcell"><span>Opérateur</span><b>${esc(operator) || "—"}</b></div>
        <div class="wcell wide"><span>Numéro</span><b class="mono">${esc(phone) || "—"}</b></div>
        ${paid ? `<div class="wcell wide"><span>Payé le</span><b>${fmtDate(w.paidAt)}</b></div>` : ""}
      </div>
    </div>`;
  }).join("");
  fitThree();
}


onAuthStateChanged(auth, user => {
  if (!user) { window.location.href = LOGIN_PAGE; return; }
  get(ref(db, `users/${user.uid}/payout`)).then(snap => { payout = snap.val() || {}; render(); });
  onValue(ref(db, `users/${user.uid}/withdrawals`), snap => {
    const v = snap.exists() ? snap.val() : {};
    items = Object.keys(v).map(k => ({ key: k, ...v[k] })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const total = items.filter(w => w.status === "Payé").reduce((t, w) => t + (Number(w.amount) || 0), 0);
    const ht = $("hTotal"); if (ht) ht.textContent = fmt(total) + " F";
    render();
  });
});
</script>
</body>
