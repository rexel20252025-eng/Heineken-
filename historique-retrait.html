<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heineken — Historique de retrait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0d2a18;min-height:100vh;display:flex;justify-content:center;background:radial-gradient(circle at 20% 0%,#1fa452 0%,transparent 45%),radial-gradient(circle at 90% 100%,#0a4f20 0%,transparent 50%),linear-gradient(170deg,#00782a 0%,#00602a 60%,#004a20 100%);background-attachment:fixed}
.app{width:100%;max-width:420px;padding:16px 16px 40px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.back{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:13px;font-weight:800}
.back svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand{font-size:13px;font-weight:800;letter-spacing:2.5px;color:#fff}
.brand span{color:#ff5a5f}
.htitle{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 18px}
.htitle h1{font-family:"Playfair Display",Georgia,serif;font-size:25px;font-weight:800;color:#fff;letter-spacing:.2px}
.hcount{min-width:32px;height:32px;padding:0 10px;border-radius:999px;background:#fff;color:#00782a;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
#hList{display:flex;flex-direction:column;gap:14px}
.wcard{background:#fff;border-radius:20px;padding:18px 18px 16px;box-shadow:0 12px 26px rgba(0,40,18,.22)}
.wtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lbl{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#6b8070}
.wamt{font-family:"Playfair Display",Georgia,serif;font-size:27px;font-weight:900;color:#0d2a18;margin-top:3px;line-height:1.1}
.wamt small{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:13px;font-weight:700;color:#4b6353;margin-left:4px}
.wrecv{margin-top:6px;font-size:13px;color:#4b6353;font-weight:600}
.wrecv b{color:#00782a;font-weight:800}
.st{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;background:#e9f9ef;color:#00602a;border:1px solid #a0ddb8;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:#1ebe5a}
.st.no{background:#fff0f0;color:#b82020;border-color:#f0a8a8}
.st.no i{background:#d71920}
.st.wait{background:#fff7e0;color:#8a5a00;border-color:#f5d98a}
.st.wait i{background:#f5a623}
.wdiv{height:1px;background:repeating-linear-gradient(90deg,#d6e4da 0 6px,transparent 6px 10px);margin:16px 0 14px}
.wbot{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:linear-gradient(135deg,#00923a,#25b96a);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
.who{flex:1;min-width:0}
.wname{font-size:15px;font-weight:800;color:#0d2a18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wphone{font-size:13px;color:#4b6353;font-weight:600;margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.op{display:inline-flex;align-items:center;padding:2px 9px;border-radius:7px;font-size:11px;font-weight:800;color:#fff;background:#3f51b5}
.op.op-wave{background:#1dc8e8;color:#053a46}
.op.op-orange{background:#ff7900}
.op.op-mtn{background:#ffcc00;color:#3d2500}
.op.op-moov{background:#2563eb}
.wmeta{text-align:right;font-size:12px;color:#6b8070;font-weight:600;line-height:1.5;white-space:nowrap}
.wmeta b{color:#0d2a18;font-weight:700}
.empty{text-align:center;padding:40px 16px;font-size:14px;color:#4b6353;background:#fff;border-radius:20px;box-shadow:0 12px 26px rgba(0,40,18,.22)}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <a class="back" href="compte.html"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg> Retour</a>
    <div class="brand">HEINEKEN<span>★</span></div>
  </div>

  <div class="htitle">
    <h1>Historique retrait</h1>
    <em class="hcount" id="hCount">0</em>
  </div>

  <div id="hList"><div class="empty">Chargement de vos retraits…</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVNLSc3JXWvTxiKk2n-mjmVUv39a_yuVM",
  authDomain: "heineken-c174e.firebaseapp.com",
  databaseURL: "https://heineken-c174e-default-rtdb.firebaseio.com",
  projectId: "heineken-c174e",
  storageBucket: "heineken-c174e.firebasestorage.app",
  messagingSenderId: "756445276249",
  appId: "1:756445276249:web:0989f661c0b97ef34be948"
};
const LOGIN_PAGE = "heineken-pro-v9.html";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const $ = id => document.getElementById(id);
const fmt = n => Math.round(Number(n) || 0).toLocaleString("fr-FR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = t => t ? new Date(t).toLocaleString("fr-FR", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }).replace(", ", " · ") : "—";
const initials = name => {
  const p = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!p.length) return "?";
  return ((p[0][0] || "") + (p[1]?.[0] || "")).toUpperCase();
};

let items = [];
let payout = {};

function render() {
  $("hCount").textContent = items.length;
  if (!items.length) {
    $("hList").innerHTML = '<div class="empty">Aucun retrait pour le moment.</div>';
    return;
  }
  $("hList").innerHTML = items.map(w => {
    const paid = w.status === "Payé" || w.status === "Approuvé";
    const rejected = w.status === "Rejeté";
    const amount = Number(w.amount) || 0;
    const fee = w.fee ?? Math.round(amount * 0.05);
    const net = w.net ?? (amount - fee);
    const name = w.name || payout.name || "";
    const operator = w.operator || payout.operator || "";
    const phone = w.phone || payout.phone || "";
    const stCls = rejected ? "no" : paid ? "" : "wait";
    const label = w.status === "Approuvé" ? "Validé" : w.status || "En attente";
    const dateLine = w.status === "Payé" && w.paidAt
      ? `Payé le <b>${fmtDate(w.paidAt)}</b>`
      : `<b>${fmtDate(w.createdAt)}</b>`;
    return `
    <div class="wcard">
      <div class="wtop">
        <div>
          <div class="lbl">Montant retiré</div>
          <div class="wamt">${fmt(amount)}<small>FCFA</small></div>
          <div class="wrecv">Vous recevez : <b>${fmt(net)} FCFA</b></div>
        </div>
        <span class="st ${stCls}"><i></i>${esc(label)}</span>
      </div>
      <div class="wdiv"></div>
      <div class="wbot">
        <div class="av">${esc(initials(name))}</div>
        <div class="who">
          <div class="wname">${esc(name) || "—"}</div>
          <div class="wphone">${esc(phone) || "—"}${operator ? `<span class="op op-${esc(opKey(operator))}">${esc(operator)}</span>` : ""}</div>
        </div>
        <div class="wmeta">${dateLine}<br>Frais : <b>${fmt(fee)} FCFA</b></div>
      </div>
    </div>`;
  }).join("");
}
const opKey = o => String(o).toLowerCase();

onAuthStateChanged(auth, user => {
  if (!user) { window.location.href = LOGIN_PAGE; return; }
  get(ref(db, `users/${user.uid}/payout`)).then(snap => { payout = snap.val() || {}; render(); });
  onValue(ref(db, `users/${user.uid}/withdrawals`), snap => {
    const v = snap.exists() ? snap.val() : {};
    items = Object.keys(v).map(k => ({ key: k, ...v[k] })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    render();
  });
});
</script>
</body>
</html>
