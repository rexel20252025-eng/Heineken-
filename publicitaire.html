<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;padding:16px;background:radial-gradient(circle at 20% 10%,#14934a 0%,transparent 45%),radial-gradient(circle at 85% 90%,#0a4f20 0%,transparent 50%),linear-gradient(170deg,#00782a 0%,#00602a 60%,#004a20 100%);background-attachment:fixed;display:flex;flex-direction:column;align-items:center;gap:18px}
.short{width:100%;max-width:320px;aspect-ratio:9 / 16;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.short iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div class="short"><iframe src="https://www.youtube.com/embed/KPW82KMVobQ" title="Vidéo 1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <div class="short"><iframe src="https://www.youtube.com/embed/BOCuu6L8rmc" title="Vidéo 2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <div class="short"><iframe src="https://www.youtube.com/embed/TvCRn6cABxM" title="Vidéo 3" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>

</html>
